// Calculate pallet spaces from dimensions
function calcPalletSpaces(wMm, lMm) {
  // Standard pallet footprint is 1200x1200mm = 1 space
  // Spaces = ceil(w/1220) * ceil(l/1220), roughly
  // But hauliers use specific rules, so use area-based approach:
  // 1 space = 1.2m x 1.2m = 1.44m2. Spaces = ceil(area / 1.44)
  // More practically: longest side / 1220 rounded up, times shortest / 1220 rounded up
  const w = Math.max(wMm, lMm);
  const l = Math.min(wMm, lMm);
  return Math.ceil(w / 1220) * Math.ceil(l / 1220);
}

// Get oversized multiplier for custom dims on TWA/Horizon
// Pallex custom dims: map to the nearest known Pallex size category (conservative - rounds up)
function getPallexOversizeMultiplier(wMm, lMm) {
  const l = Math.max(wMm, lMm), w = Math.min(wMm, lMm);
  if (l <= 1220 && w <= 1220) return { multiplier: 1, note: "(fits standard footprint)" };
  if (l <= 1525 && w <= 1525) return { multiplier: 1.75, note: "(within 1525 x 1525mm, charged as 5x5)" };
  if (w <= 1220 && l <= 2440) return { multiplier: 2, note: "(within 2440 x 1220mm, charged as 8x4)" };
  if (w <= 1220 && l <= 3050) return { multiplier: 3, note: "(within 3050 x 1220mm, charged as 10x4)" };
  if (w <= 1525 && l <= 3050) return { multiplier: 4, note: "(within 3050 x 1525mm, charged as 10x5)" };
  return null; // outside known Pallex size categories
}

function getCustomOversizeInfo(wMm, lMm, haulier) {
  // Hauliers book standard sheet dims rounded down (3.05m -> 3.0m, 2.44m -> 2.4m, 1.22m -> 1.2m),
  // so apply the same shave before banding. 1525 is kept as-is per the booking convention.
  const shave = v => ({ 610: 600, 1220: 1200, 1830: 1800, 2440: 2400, 3050: 3000 }[v] || v);
  // Matrix bands are in decimetres (12 = 1.2m), matching the haulier oversized matrices
  const widthDm = shave(Math.min(wMm, lMm)) / 100;
  const lengthDm = shave(Math.max(wMm, lMm)) / 100;
  
  // TWA matrix breakpoints
  const twaWidthBands = [[0,12,0],[12.1,15,0.25],[15.1,18,0.50],[18.1,21,0.75],[21.1,24,1.0]];
  const twaLengthBands = [[0,12,0],[12.1,15,0.25],[15.1,18,0.50],[18.1,21,0.75],[21.1,24,1.0],[24.1,27,1.25],[27.1,30,1.50],[30.1,33,1.75],[33.1,36,2.0],[36.1,39,2.25],[39.1,42,2.50],[42.1,45,2.75],[45.1,48,3.0],[48.1,51,3.25]];
  
  // Horizon matrix breakpoints (wider width bands)
  const hzWidthBands = [[0,12,0],[12.1,16,0.25],[16.1,18,0.50],[18.1,21,0.75],[21.1,24,1.0]];
  const hzLengthBands = twaLengthBands; // Same length bands
  
  const isHorizon = haulier.startsWith("Horizon");
  const widthBands = isHorizon ? hzWidthBands : twaWidthBands;
  const lengthBands = isHorizon ? hzLengthBands : twaLengthBands;
  
  let wPct = null, lPct = null;
  for (const [lo, hi, pct] of widthBands) {
    if (widthDm >= lo && widthDm <= hi) { wPct = pct; break; }
  }
  for (const [lo, hi, pct] of lengthBands) {
    if (lengthDm >= lo && lengthDm <= hi) { lPct = pct; break; }
  }
  
  if (wPct === null || lPct === null) return null; // N/A
  
  const totalPct = wPct + lPct;
  if (totalPct === 0) return { multiplier: 1.0, label: "Standard rate", note: "Within standard dims" };
  
  const multiplier = 1 + totalPct;
  const label = "STR + " + Math.round(totalPct * 100) + "%";
  return { multiplier, label, note: (widthDm*10).toFixed(0) + "x" + (lengthDm*10).toFixed(0) + "cm" };
}

// Pallex pallet type from weight: <600kg = Half (idx 2), >=600kg = Full (idx 4)
function getPallexTypeIndex(weight) {

}

// ============ POSTCODE MATCHING ============

// Clean pasted postcode input. Accepts bare postcodes, full postcodes, or whole address
// lines copied from the Hub - extracts the last UK-postcode-looking token (addresses end
// with the postcode). Normal short typing passes through untouched apart from uppercasing.
function cleanPostcodeInput(raw) {
  let v = (raw || "").toUpperCase();
  if (v.length > 9 || v.indexOf(",") !== -1 || v.trim().split(/\s+/).length > 2) {
    const ms = Array.from(v.matchAll(/[A-Z]{1,2}\d{1,2}[A-Z]?\s*\d[A-Z]{2}|[A-Z]{1,2}\d{1,2}[A-Z]?/g));
    if (ms.length) {
      // Prefer a complete postcode (with inward part) over outward-only tokens,
      // so road numbers like "M25" after the postcode can't win
      const fulls = ms.filter(m => /\d[A-Z]{2}$/.test(m[0].replace(/\s+/g, "")) && m[0].replace(/\s+/g, "").length >= 5);
      v = (fulls.length ? fulls[fulls.length - 1] : ms[ms.length - 1])[0];
    }
  }
  v = v.replace(/\s+/g, " ").replace(/[^A-Z0-9 ]/g, "").replace(/\s+/g, " ").trimStart();
  return v.slice(0, 9);
}

function extractPostcodeArea(pc) {
  let clean = pc.toUpperCase().trim();
  // Keep only the outward code if a full postcode was typed with a space (e.g. "M1 1AA" -> "M1")
  const sp = clean.split(/\s+/);
  clean = sp[0];
  // Full postcode typed without a space (e.g. "M11AA"): strip the inward part (digit + 2 letters)
  if (sp.length === 1 && clean.length > 4 && /\d[A-Z]{2}$/.test(clean)) clean = clean.replace(/\d[A-Z]{2}$/, '');
  // Valid UK outward format: 1-2 letters + 1-2 digits + optional trailing letter (SW1A, N1C)
  const m = clean.match(/^([A-Z]{1,2})(\d{1,2})([A-Z])?$/);
  if (m) return { area: m[1], district: parseInt(m[2]) };
  // Bare area letters only (partial typing, e.g. "PL")
  const a = clean.match(/^([A-Z]{1,2})$/);
  if (a) return { area: a[1], district: null };
  // Anything else (PL293748, 123, M1X9...) is not a valid postcode
  return { area: null, district: null, invalid: true };
}

// Shared smart postcode parser: handles "BA3,5,8-11,13-15, CB, CF" by carrying
// the last-seen area prefix forward when a fragment is just a number or range.
function parsePostcodeString(str) {
  const parts = str.split(',').map(p => p.trim()).filter(Boolean);
  const entries = [];
  let lastArea = null;
  
  for (let part of parts) {
    // Skip purely descriptive text
    if (part.includes('(') || part.includes('excluding')) continue;
    
    // Strip leading descriptive words: "Belfast BT1-18" -> "BT1-18", "Isle of Man IM" -> "IM"
    // Find the last word that starts with uppercase and looks like a postcode
    const words = part.split(/\s+/);
    if (words.length > 1) {
      // Find rightmost token that looks like a postcode pattern (starts with letter, may have digits)
      for (let w = words.length - 1; w >= 0; w--) {
        if (/^[A-Z]/.test(words[w]) && /^[A-Z]+\d*/.test(words[w])) {
          // Rejoin from this word onwards (handles "Rest of Northern Ireland BT19+" -> "BT19+")
          part = words.slice(w).join(' ');
          // If still multi-word and second word is a postcode too, split them
          // e.g. "Guernsey GY1-8" -> "GY1-8"
          if (/^[A-Z]+\d/.test(part.split(/\s+/)[0]) || /^[A-Z]+$/.test(part.split(/\s+/)[0])) {
            part = part.split(/\s+/)[0];
          }
          break;
        }
      }
    }
    
    // Skip remaining descriptive-only text
    if (/^(Rest|Dublin|Belfast|Jersey|Guernsey|Alderney|Sark|Herm|Isle|of|Northern|Ireland|Island|City|County|Scilly|Isles)$/i.test(part)) continue;
    if (part.includes('Rest of') || part.includes('Dublin')) continue;
    
    // Full pattern with area: "BA3-5" or "BA3" or "BA"
    const fullRange = part.match(/^([A-Z]+)(\d+)-(\d+)$/);
    if (fullRange) {
      lastArea = fullRange[1];
      entries.push({ area: fullRange[1], lo: parseInt(fullRange[2]), hi: parseInt(fullRange[3]) });
      continue;
    }
    const fullSingle = part.match(/^([A-Z]+)(\d+)$/);
    if (fullSingle) {
      lastArea = fullSingle[1];
      entries.push({ area: fullSingle[1], exact: parseInt(fullSingle[2]) });
      continue;
    }
    const bareArea = part.match(/^([A-Z]+)$/);
    if (bareArea) {
      lastArea = bareArea[1];
      entries.push({ area: bareArea[1] });
      continue;
    }
    // Bare range "8-11" -- carry forward lastArea
    const bareRange = part.match(/^(\d+)-(\d+)$/);
    if (bareRange && lastArea) {
      entries.push({ area: lastArea, lo: parseInt(bareRange[1]), hi: parseInt(bareRange[2]) });
      continue;
    }
    // Bare number "5" -- carry forward lastArea
    const bareNum = part.match(/^(\d+)$/);
    if (bareNum && lastArea) {
      entries.push({ area: lastArea, exact: parseInt(bareNum[1]) });
      continue;
    }
    // Anything with a + like "BT19+"
    const plusMatch = part.match(/^([A-Z]+)(\d+)\+$/);
    if (plusMatch) {
      lastArea = plusMatch[1];
      entries.push({ area: plusMatch[1], lo: parseInt(plusMatch[2]), hi: 999 });
      continue;
    }
  }
  return entries;
}

const _ukDistrictSets = {};
function isKnownUKDistrict(area, district) {
  if (district === null || district === undefined) return true;
  if (!(area in UK_DISTRICTS)) return false; // unknown area letters
  if (!_ukDistrictSets[area]) {
    const s = new Set();
    UK_DISTRICTS[area].split(",").forEach(part => {
      const m = part.match(/^(\d+)-(\d+)$/);
      if (m) { for (let i = parseInt(m[1]); i <= parseInt(m[2]); i++) s.add(i); }
      else s.add(parseInt(part));
    });
    _ukDistrictSets[area] = s;
  }
  return _ukDistrictSets[area].has(district);
}

// Districts explicitly listed on the rate sheets (built once at startup) are also "known"
let _sheetDistricts = null;
function isOnAnySheetExplicitly(area, district) {
  if (_sheetDistricts === null) {
    _sheetDistricts = {};
    const add = (a, d) => { if (!_sheetDistricts[a]) _sheetDistricts[a] = new Set(); _sheetDistricts[a].add(d); };
    // Longs pre-expanded list
    for (const [pattern] of LONGS_ZONE_LIST) {
      let m = pattern.match(/^([A-Z]+)(\d+)-(\d+)$/);
      if (m) { for (let i = parseInt(m[2]); i <= parseInt(m[3]); i++) add(m[1], i); continue; }
      m = pattern.match(/^([A-Z]+)(\d+)$/);
      if (m) add(m[1], parseInt(m[2]));
    }
    // String-based zone tables (CDL, TWA, Horizon, Pallex)
    const scanString = (str) => {
      for (const e of parsePostcodeString(str)) {
        if (e.lo !== undefined && e.hi !== undefined) { for (let i = e.lo; i <= e.hi; i++) add(e.area, i); }
        else if (e.exact !== undefined) add(e.area, e.exact);
      }
    };
    CDL_ZONES.forEach(z => scanString(z.postcodes));
    TWA_ND.forEach(r => scanString(r[1]));
    TWA_ECO.forEach(r => scanString(r[1]));
    HORIZON_RATES.forEach(r => scanString(r[1]));
    PALLEX_ZONES.forEach(r => scanString(r[1]));
  }
  return !!(_sheetDistricts[area] && _sheetDistricts[area].has(district));
}

// A district is plausible if it's a real UK geographic district OR explicitly on a rate sheet
function isPlausibleDistrict(postcode) {
  const { area, district } = extractPostcodeArea(postcode);
  if (area === null || district === null) return true; // format/partial handled elsewhere
  return isKnownUKDistrict(area, district) || isOnAnySheetExplicitly(area, district);
}

function postcodeMatchesString(postcode, postcodeString) {
  const { area, district } = extractPostcodeArea(postcode);
  const entries = parsePostcodeString(postcodeString);
  
  for (const e of entries) {
    if (e.area !== area) continue;
    if (e.lo !== undefined && e.hi !== undefined) {
      // Range match
      if (district !== null && district >= e.lo && district <= e.hi) return true;
    } else if (e.exact !== undefined) {
      // Single district match
      if (district !== null && district === e.exact) return true;
    } else {
      // Bare area match
      return true;
    }
  }
  return false;
}

function matchCDLZone(postcode) {
  const { area } = extractPostcodeArea(postcode);
  
  for (const z of CDL_ZONES) {
    // Handle remainder zones - use regex word boundary to avoid DN matching N
    if (z.postcodes.includes('(remainder)')) {
      const remainderRegex = new RegExp('(^|,\\s*)' + area + ' \\(remainder\\)');
      if (remainderRegex.test(z.postcodes)) return z;
    }
    if (postcodeMatchesString(postcode, z.postcodes)) return z;
  }
  return null;
}

function matchTWAZone(postcode, rateTable) {
  for (const row of rateTable) {
    if (postcodeMatchesString(postcode, row[1])) return row;
  }
  return null;
}

function matchLongsZone(postcode) {
  const { area, district } = extractPostcodeArea(postcode);
  
  // Match with specificity precedence: exact district > range > bare area.
  // Rate cards list broad ranges with specific carve-outs (e.g. N1-11 -> Z10 but N3 -> Z9),
  // so the most specific matching pattern wins regardless of list order.
  let best = null; // { zone, specificity }
  for (const [pattern, zone] of LONGS_ZONE_LIST) {
    const rm = pattern.match(/^([A-Z]+)(\d+)-(\d+)$/);
    if (rm) {
      if (rm[1] === area && district !== null && district >= parseInt(rm[2]) && district <= parseInt(rm[3])) {
        if (!best || best.specificity < 2) best = { zone, specificity: 2 };
      }
      continue;
    }
    const sm = pattern.match(/^([A-Z]+)(\d+)$/);
    if (sm) {
      if (sm[1] === area && district !== null && district === parseInt(sm[2])) {
        return zone; // exact match is the highest specificity - return immediately
      }
      continue;
    }
    if (pattern === area) {
      if (!best) best = { zone, specificity: 1 };
    }
  }
  return best ? best.zone : null;
}

function matchHorizonZone(postcode) {
  for (const row of HORIZON_RATES) {
    if (postcodeMatchesString(postcode, row[1])) return row;
  }
  return null;
}

// ============ MULTI-ZONE CONFLICT DETECTION ============

function findAllCDLMatches(postcode) {
  const matches = [];
  for (const z of CDL_ZONES) {
    if (z.postcodes.includes('(remainder)')) {
      const { area } = extractPostcodeArea(postcode);
      if (z.postcodes.startsWith(area)) matches.push(z);
    } else if (postcodeMatchesString(postcode, z.postcodes)) {
      matches.push(z);
    }
  }
  return matches;
}

function findAllLongsMatches(postcode) {
  const { area, district } = extractPostcodeArea(postcode);
  const matches = [];
  const seenZones = new Set();
  for (const [pattern, zone] of LONGS_ZONE_LIST) {
    let hit = false;
    let specificity = 0; // 3 = exact district, 2 = range, 1 = bare area
    const rm = pattern.match(/^([A-Z]+)(\d+)-(\d+)$/);
    if (rm) { hit = rm[1] === area && district !== null && district >= parseInt(rm[2]) && district <= parseInt(rm[3]); specificity = 2; }
    else {
      const sm = pattern.match(/^([A-Z]+)(\d+)$/);
      if (sm) { hit = sm[1] === area && district !== null && district === parseInt(sm[2]); specificity = 3; }
      else { hit = pattern === area; specificity = 1; }
    }
    if (hit && !seenZones.has(zone)) {
      seenZones.add(zone);
      matches.push({ zone, pattern, specificity });
    }
  }
  // Specificity precedence: an exact-district entry is an intentional carve-out from a broader
  // range or bare-area entry, not a data conflict. Only report entries at the HIGHEST
  // specificity level that matched; a conflict now means two same-specificity entries disagree.
  if (matches.length > 1) {
    const maxSpec = Math.max(...matches.map(m => m.specificity));
    return matches.filter(m => m.specificity === maxSpec);
  }
  return matches;
}

function findAllTWAMatches(postcode, rateTable) {
  const matches = [];
  for (const row of rateTable) {
    if (postcodeMatchesString(postcode, row[1])) matches.push(row);
  }
  return matches;
}

function findAllHorizonMatches(postcode) {
  const matches = [];
  for (const row of HORIZON_RATES) {
    if (postcodeMatchesString(postcode, row[1])) matches.push(row);
  }
  return matches;
}

// ============ RATE CALCULATION ============

function getPalletWeightType(weight) {
  if (weight <= 150) return 0; // micro
  if (weight <= 300) return 1; // quarter
  if (weight <= 600) return 2; // half
  if (weight <= 600) return 3; // light full (same weight, height differentiates)
  if (weight <= 1200) return 4; // full
  return 5; // full plus
}

function getPalletTypeIndex(weight, height) {
  // MP=0, QP=1, HP=2, LFP=3, FP=4, FP+=5
  // Without height info, use weight alone:
  // <=150kg = Micro, <=300kg = Quarter, <=600kg = Full (not Half, since we can't distinguish without height)
  // <=1200kg = Full, >1200kg = Full Plus
  if (height) {
    // With height we can be precise
    if (weight <= 150 && height <= 0.6) return 0;
    if (weight <= 300 && height <= 0.8) return 1;
    if (weight <= 600 && height <= 1.2) return 2;
    if (weight <= 600 && height <= 2.2) return 3;
    if (weight <= 1200) return 4;
    return 5;
  }
  // Without height, default conservatively
  if (weight <= 150) return 0;
  if (weight <= 300) return 1;
  if (weight <= 1200) return 4; // Full Pallet
  return 5; // Full Plus
}

// Oversized multipliers from the surcharge matrices
// TWA matrix: width rows (120 | 121-150 | 151-180 | 181-210 | 211-240) x length cols
// Horizon matrix: width rows (120 | 121-160 | 161-180 | 181-210 | 211-240) x length cols
// 8x4: 2440x1220mm -> STR + 100%
// 5x5: 1525x1525mm = 153x153cm
//   TWA: 151-180 x 151-180 = STR + 100%
//   Horizon: 121-160 x 121-160 = Rate + 50%
// 5x10: 3050x1525mm = 305x153cm
//   TWA: 151-180 x 301-330 = N/A
//   Horizon: 121-160 x 301-330 = Rate + 200%
function getOversizeInfo(palletSize, haulier, customW, customL) {
  const isHorizon = haulier.startsWith("Horizon");
  
  if (palletSize === "custom" && customW && customL) {
    // If the custom dims match a named size, use the named-size rules so custom
    // and named quotes can never disagree (e.g. TWA 3050x1220 must stay N/A like 10x4)
    const w = Math.min(parseFloat(customW), parseFloat(customL));
    const l = Math.max(parseFloat(customW), parseFloat(customL));
    if (l === 2440 && w === 1220) return getOversizeInfo("8x4", haulier);
    if (l === 1525 && w === 1525) return getOversizeInfo("5x5", haulier);
    if (l === 3050 && w === 1220) return getOversizeInfo("10x4", haulier);
    if (l === 3050 && w === 1525) return getOversizeInfo("10x5", haulier);
    return getCustomOversizeInfo(customW, customL, haulier);
  }
  if (palletSize === "8x4") {
    return { multiplier: 2.0, label: "STR + 100%", note: "8x4 at 244x122cm" };
  }
  if (palletSize === "4x4") {
    return { multiplier: 1.0, label: "Standard rate", note: "4x4 within standard dims" };
  }
  if (palletSize === "5x5") {
    if (haulier === "TWA") return { multiplier: 2.0, label: "STR + 100%", note: "5x5 at 153x153cm" };
    if (isHorizon) return { multiplier: 1.5, label: "Rate + 50%", note: "5x5 at 153x153cm" };
  }
  if (palletSize === "10x4") {
    if (haulier === "TWA") return null; // N/A
    if (isHorizon) return { multiplier: 3.0, label: "Rate + 200%", note: "10x4 at 305x122cm" };
  }
  if (palletSize === "10x5") {
    if (haulier === "TWA") return null; // N/A
    if (isHorizon) return { multiplier: 3.0, label: "Rate + 200%", note: "10x5 at 305x153cm" };
  }
  return null;
}

function calculateRate(haulier, postcode, palletSize, qty, weightKg, surcharges, customW, customL, allWeights, collectionId) {
  // Input sanity guards (mis-typed jobs)
  {
    const _r = { zone: null, nd: null, eco: null, breakdown: {}, warnings: [], errors: [], info: [], courier: null, estimated: false, fuelPct: 0 };
    if (!qty || qty < 1) { _r.errors.push("Pallet quantity must be at least 1."); return _r; }
    if (palletSize === "custom") {
      const _cw = parseFloat(customW), _cl = parseFloat(customL);
      if (!_cw || !_cl || _cw < 100 || _cl < 100) { _r.errors.push("Custom dimensions look wrong — enter width and length in mm (e.g. 2440 x 1220)."); return _r; }
      if (_cw > 4000 || _cl > 4000) { _r.errors.push("Custom dimensions exceed 4000mm — check the figures. If correct, this needs a manual haulier quote."); return _r; }
    }
  }
  const _districtPlausible = isPlausibleDistrict(postcode);
  const result = { nd: null, eco: null, zone: null, breakdown: {}, warnings: [], errors: [], info: [] };
  const FUEL_SURCHARGE = getFuelSurcharge(haulier);
  result.fuelPct = (FUEL_SURCHARGE * 100);
  
  // Resolve pallet spaces
  let spaces;
  if (palletSize === "custom" && customW && customL) {
    spaces = calcPalletSpaces(customW, customL);
    result.info.push("Custom dims: " + customW + " x " + customL + "mm = " + spaces + " pallet space" + (spaces !== 1 ? "s" : ""));
  } else {
    const ps = PALLET_SIZES.find(p => p.id === palletSize);
    spaces = ps ? ps.spaces : 1;
  }
  const isOversized = spaces > 1;
  const typeIdx = getPalletTypeIndex(weightKg);
  
  if (haulier === "CDL") {
    const z = matchCDLZone(postcode);
    if (!z) { result.errors.push("Postcode not found in CDL zones"); return result; }
    result.zone = `Zone ${z.zone}`;
    result.estimated = z.estimated || false;
    if (z.estimated) {
      result.info.push("Not on CDL rate sheet - based on best estimate (Zone " + z.zone + ")");
    }
    
    // Conflict check
    const allMatches = findAllCDLMatches(postcode);
    if (allMatches.length > 1) {
      const zoneList = allMatches.map(m => `Zone ${m.zone}`).join(', ');
      result.warnings.push(`Zone conflict: ${postcode.toUpperCase()} matches ${zoneList}. Using Zone ${z.zone} (first match). Verify manually.`);
    }
    
    if (isOversized) {
      result.info.push(`Oversized: ${palletSize} = ${spaces} pallet spaces x ${qty} = ${spaces * qty} total spaces. CDL charges per space.`);
    }
    
    const totalSpaces = spaces * qty;
    const ndPerSpace = z.nd;
    const ecoPerSpace = z.eco;
    
    if (ndPerSpace !== "N/A" && ndPerSpace !== "POA") {
      let ndBase = ndPerSpace * totalSpaces;
      let surchargeTotal = 0;
      if (surcharges.includes("am")) surchargeTotal += 12;
      if (surcharges.includes("timed")) surchargeTotal += 15;
      const ndBeforeFuel = ndBase + surchargeTotal;
      result.nd = +(ndBeforeFuel * (1 + FUEL_SURCHARGE)).toFixed(2);
      result.breakdown.nd = { base: ndBase, perSpace: ndPerSpace, spaces: totalSpaces, surcharges: surchargeTotal, fuel: +(ndBeforeFuel * FUEL_SURCHARGE).toFixed(2) };
    } else if (ndPerSpace === "N/A") {
      result.breakdown.ndNote = "N/A -- Economy only for this zone";
    } else {
      result.breakdown.ndNote = "POA -- contact CDL for pricing";
    }
    
    if (ecoPerSpace !== "N/A" && ecoPerSpace !== "POA") {
      let ecoBase = ecoPerSpace * totalSpaces;
      let surchargeTotal = 0;
      if (surcharges.includes("am")) surchargeTotal += 12;
      if (surcharges.includes("timed")) surchargeTotal += 15;
      const ecoBeforeFuel = ecoBase + surchargeTotal;
      result.eco = +(ecoBeforeFuel * (1 + FUEL_SURCHARGE)).toFixed(2);
      result.breakdown.eco = { base: ecoBase, perSpace: ecoPerSpace, spaces: totalSpaces, surcharges: surchargeTotal, fuel: +(ecoBeforeFuel * FUEL_SURCHARGE).toFixed(2) };
    } else if (ecoPerSpace === "POA") {
      result.breakdown.ecoNote = "POA -- contact CDL for pricing";
    }
    
  } else if (haulier === "Longs of Leeds") {
    const zone = matchLongsZone(postcode);
    if (zone === null) { result.errors.push("Postcode not found in Longs zones"); return result; }
    result.zone = `Zone ${zone}`;
    
    // Conflict check
    const allMatches = findAllLongsMatches(postcode);
    if (allMatches.length > 1) {
      const zoneList = allMatches.map(m => `Zone ${m.zone}`).join(', ');
      result.warnings.push(`Zone conflict: ${postcode.toUpperCase()} matches ${zoneList}. Using Zone ${zone} (first match). Verify manually.`);
    }
    
    // For oversized: use combined FP columns based on total spaces
    // For standard: use weight-based column
    const totalSpaces = spaces * qty;
    let colIdx;
    if (isOversized) {
      // 2FP=col5, 3FP=col6, 4FP=col7, 5FP=col8, 6FP=col9
      if (totalSpaces <= 1) colIdx = 4;
      else if (totalSpaces <= 2) colIdx = 5;
      else if (totalSpaces <= 3) colIdx = 6;
      else if (totalSpaces <= 4) colIdx = 7;
      else if (totalSpaces <= 5) colIdx = 8;
      else colIdx = 9;
      
      if (spaces > 6) {
        result.errors.push(`A single ${palletSize === 'custom' ? customW + ' x ' + customL + 'mm' : palletSize} pallet is ${spaces} pallet spaces — outside the Longs rate card. Check the dimensions or contact Longs for a quote.`);
        return result;
      }
      if (totalSpaces > 6) {
        result.warnings.push(`${totalSpaces} pallet spaces exceeds 6 FP max on Longs rate card. Contact Longs for quotation. Estimate below based on 2FP x ${qty} pallets.`);
        // Estimate: use 2FP column (index 5) x number of pallets
        colIdx = 5;
        const ndRates = LONGS_ND[zone];
        const ecoRates = LONGS_ECO[zone];
        if (ndRates) {
          const ndBase = ndRates[colIdx] * qty;
          let surchargeTotal = 0;
          if (surcharges.includes("am")) surchargeTotal += 15.63;
          if (surcharges.includes("timed")) surchargeTotal += 26;
          const ndBeforeFuel = ndBase + surchargeTotal;
          result.nd = +(ndBeforeFuel * (1 + FUEL_SURCHARGE)).toFixed(2);
          result.breakdown.nd = { base: ndBase, surcharges: surchargeTotal, fuel: +(ndBeforeFuel * FUEL_SURCHARGE).toFixed(2), note: `${qty} x 2FP estimate` };
        }
        if (ecoRates) {
          const ecoBase = ecoRates[colIdx] * qty;
          let surchargeTotal = 0;
          if (surcharges.includes("am")) surchargeTotal += 15.63;
          if (surcharges.includes("timed")) surchargeTotal += 26;
          const ecoBeforeFuel = ecoBase + surchargeTotal;
          result.eco = +(ecoBeforeFuel * (1 + FUEL_SURCHARGE)).toFixed(2);
          result.breakdown.eco = { base: ecoBase, surcharges: surchargeTotal, fuel: +(ecoBeforeFuel * FUEL_SURCHARGE).toFixed(2), note: `${qty} x 2FP estimate` };
        }
        result.info.push(`Oversized: ${palletSize} = ${spaces} spaces x ${qty} = ${totalSpaces} total. Estimated as ${qty} x 2FP (£${LONGS_ND[zone]?.[5]}/ea ND).`);
        result.zone = `Zone ${zone}`;
        result.estimated = true;
        return result;
      }
      result.info.push(`Oversized: ${palletSize} = ${spaces} spaces x ${qty} = ${totalSpaces} total. Using ${totalSpaces}FP combined column.`);
    } else {
      colIdx = typeIdx;
    }
    
    const ndRates = LONGS_ND[zone];
    const ecoRates = LONGS_ECO[zone];
    
    // Zone 21 = ND only, Zones 19,20,22 = Economy only
    const ecoOnlyZones = [19, 20, 22];
    const ndOnlyZones = [21];
    
    if (!ndOnlyZones.includes(zone)) {
      // Has economy
      if (ecoRates && typeof ecoRates[0] === 'number') {
        let ecoBase;
        if (isOversized) {
          ecoBase = (colIdx <= 9 && ecoRates[colIdx]) ? ecoRates[colIdx] : null;
        } else {
          ecoBase = (ecoRates[colIdx] || 0) * qty;
        }
        if (ecoBase !== null && ecoBase > 0) {
          let surchargeTotal = 0;
          if (surcharges.includes("am")) surchargeTotal += 15.63;
          if (surcharges.includes("timed")) surchargeTotal += 26;
          const ecoBeforeFuel = ecoBase + surchargeTotal;
          result.eco = +(ecoBeforeFuel * (1 + FUEL_SURCHARGE)).toFixed(2);
          result.breakdown.eco = { base: ecoBase, surcharges: surchargeTotal, fuel: +(ecoBeforeFuel * FUEL_SURCHARGE).toFixed(2) };
        }
      }
    } else {
      result.breakdown.ecoNote = "Zone " + zone + " -- Next Day only";
    }
    
    if (!ecoOnlyZones.includes(zone)) {
      // Has next day
      if (ndRates && typeof ndRates[0] === 'number') {
        let ndBase;
        if (isOversized) {
          ndBase = (colIdx <= 9 && ndRates[colIdx]) ? ndRates[colIdx] : null;
        } else {
          ndBase = (ndRates[colIdx] || 0) * qty;
        }
        if (ndBase !== null && ndBase > 0) {
          let surchargeTotal = 0;
          if (surcharges.includes("am")) surchargeTotal += 15.63;
          if (surcharges.includes("timed")) surchargeTotal += 26;
          const ndBeforeFuel = ndBase + surchargeTotal;
          result.nd = +(ndBeforeFuel * (1 + FUEL_SURCHARGE)).toFixed(2);
          result.breakdown.nd = { base: ndBase, surcharges: surchargeTotal, fuel: +(ndBeforeFuel * FUEL_SURCHARGE).toFixed(2) };
        }
      }
    } else {
      result.breakdown.ndNote = "Zone " + zone + " -- Economy only";
    }
    
  } else if (haulier === "TWA") {
    const ndRow = matchTWAZone(postcode, TWA_ND);
    const ecoRow = matchTWAZone(postcode, TWA_ECO);
    if (!ndRow && !ecoRow) { result.errors.push("Postcode not found in TWA zones"); return result; }
    result.zone = ndRow ? `Zone ${ndRow[0]}` : `Zone ${ecoRow[0]}`;
    
    // Conflict check
    const allMatches = findAllTWAMatches(postcode, TWA_ND);
    if (allMatches.length > 1) {
      const zoneList = allMatches.map(m => `Zone ${m[0]}`).join(', ');
      result.warnings.push(`Zone conflict: ${postcode.toUpperCase()} matches ${zoneList}. Using ${result.zone} (first match). Verify manually.`);
    }
    
    // London zone check: Full Pallet only for 1-3 pallets
    const zoneName = ndRow ? ndRow[0] : ecoRow[0];
    const isLondon = typeof zoneName === 'string' && zoneName.includes('London');
    if (isLondon && typeIdx < 4 && !isOversized) {
      result.errors.push(`TWA ${zoneName}: Full Pallet only for 1-3 pallets. Smaller pallet types not available.`);
      return result;
    }
    
    // Size index: micro=0, qtr=1, half=2, fl=3, full=4, fp=5
    let sizeIdx = isOversized ? 4 : typeIdx;
    
    const getRate = (row, pltCount) => {
      if (!row) return null;
      const rateArr = pltCount === 1 ? row[2] : pltCount === 2 ? row[3] : row[4];
      if (!rateArr || rateArr[sizeIdx] === null) return null;
      return rateArr[sizeIdx];
    };
    
    if (!isOversized) {
      const ndBase = getRate(ndRow, Math.min(qty, 3));
      const ecoBase = getRate(ecoRow, Math.min(qty, 3));
      
      if (ndBase !== null) {
        let surchargeTotal = 0;
        if (surcharges.includes("am")) surchargeTotal += 7.5;
        if (surcharges.includes("timed")) surchargeTotal += 15;
        const total = ndBase + surchargeTotal;
        result.nd = +(total * (1 + FUEL_SURCHARGE)).toFixed(2);
        result.breakdown.nd = { base: ndBase, surcharges: surchargeTotal, fuel: +(total * FUEL_SURCHARGE).toFixed(2) };
      }
      if (ecoBase !== null) {
        let surchargeTotal = 0;
        if (surcharges.includes("am")) surchargeTotal += 7.5;
        if (surcharges.includes("timed")) surchargeTotal += 15;
        const total = ecoBase + surchargeTotal;
        result.eco = +(total * (1 + FUEL_SURCHARGE)).toFixed(2);
        result.breakdown.eco = { base: ecoBase, surcharges: surchargeTotal, fuel: +(total * FUEL_SURCHARGE).toFixed(2) };
      }
    } else {
      // Oversized: look up from matrix
      const osInfo = getOversizeInfo(palletSize, "TWA", customW, customL);
      if (!osInfo) {
        result.errors.push(`${palletSize} is N/A on the TWA oversized matrix. Contact TWA for quotation.`);
        return result;
      }
      
      result.info.push(`Oversized: ${palletSize} priced at ${osInfo.label} (${osInfo.note})`);
      
      const ndBase1 = getRate(ndRow, 1);
      const ecoBase1 = getRate(ecoRow, 1);
      
      const calcOS = (base1, label) => {
        if (base1 === null) return null;
        let base = base1 * osInfo.multiplier * qty;
        let surchargeTotal = surcharges.includes("am") ? 7.5 : 0;
        if (surcharges.includes("timed")) surchargeTotal += 15;
        const total = base + surchargeTotal;
        return { total: +(total * (1 + FUEL_SURCHARGE)).toFixed(2), base: +base.toFixed(2), surcharges: surchargeTotal, fuel: +(total * FUEL_SURCHARGE).toFixed(2), note: osInfo.label };
      };
      
      const ndCalc = calcOS(ndBase1, 'nd');
      const ecoCalc = calcOS(ecoBase1, 'eco');
      if (ndCalc) { result.nd = ndCalc.total; result.breakdown.nd = ndCalc; }
      if (ecoCalc) { result.eco = ecoCalc.total; result.breakdown.eco = ecoCalc; }
    }
    
  } else if (haulier === "Horizon (Austin Wilkinson)") {
    const row = matchHorizonZone(postcode);
    if (!row) { result.errors.push("Postcode not found in Horizon zones"); return result; }
    result.zone = row[0];
    
    // Conflict check
    const allMatches = findAllHorizonMatches(postcode);
    if (allMatches.length > 1) {
      const zoneList = allMatches.map(m => m[0]).join(', ');
      result.warnings.push(`Zone conflict: ${postcode.toUpperCase()} matches ${zoneList}. Using ${row[0]} (first match). Verify manually.`);
    }
    
    const r = row[2]; // [plus_prem, plus_eco, full_prem, full_eco, lf_prem, lf_eco, half_prem, half_eco, qtr_prem, qtr_eco, micro_prem, micro_eco]
    
    // Map typeIdx to rate array position: [premIdx, ecoIdx]
    const rateMap = { 0: [10,11], 1: [8,9], 2: [6,7], 3: [4,5], 4: [2,3], 5: [0,1] };
    
    if (!isOversized) {
      const [premIdx, ecoIdx] = rateMap[typeIdx] || rateMap[4];
      const ndBase = r[premIdx];
      const ecoBase = r[ecoIdx];
      
      const calcTotal = (base) => {
        if (base === null) return null;
        let total = base * qty;
        let surchargeTotal = 0;
        if (surcharges.includes("am")) {
          // Horizon AM: 2-3 plt = £10.50, 4-5 = £12, 6 = £12, 7+ = £17. 1 plt not listed.
          if (qty === 1) {
            surchargeTotal += 10.5;
            result.info.push("Horizon AM for 1 pallet not listed on rate sheet. Using 2-3 pallet rate (£10.50). Verify with haulier.");
          } else if (qty <= 3) surchargeTotal += 10.5;
          else if (qty <= 6) surchargeTotal += 12;
          else surchargeTotal += 17;
        }
        if (surcharges.includes("timed")) surchargeTotal += 17;
        return { total: +((total + surchargeTotal) * (1 + FUEL_SURCHARGE)).toFixed(2), base: total, surcharges: surchargeTotal, fuel: +((total + surchargeTotal) * FUEL_SURCHARGE).toFixed(2) };
      };
      
      const ndCalc = calcTotal(ndBase);
      const ecoCalc = calcTotal(ecoBase);
      if (ndCalc) { result.nd = ndCalc.total; result.breakdown.nd = ndCalc; }
      else if (ndBase === null) { result.breakdown.ndNote = "Premium not available for this zone"; }
      if (ecoCalc) { result.eco = ecoCalc.total; result.breakdown.eco = ecoCalc; }
      else if (ecoBase === null) { result.breakdown.ecoNote = "Economy not available for this zone"; }
    } else {
      // Oversized: look up from matrix
      const osInfo = getOversizeInfo(palletSize, "Horizon (Austin Wilkinson)", customW, customL);
      if (!osInfo) {
        result.errors.push(`${palletSize} is N/A on the Horizon oversized matrix. Contact Horizon for quotation.`);
        return result;
      }
      
      result.info.push(`Oversized: ${palletSize} priced at ${osInfo.label} (${osInfo.note})`);
      
      const baseNd = r[2]; // Full Premium as STR
      const baseEco = r[3]; // Full Economy as STR
      
      const calcOS = (base) => {
        if (base === null) return null;
        let total = base * osInfo.multiplier * qty;
        let surchargeTotal = 0;
        if (surcharges.includes("am")) surchargeTotal += qty <= 3 ? 10.5 : qty <= 6 ? 12 : 17;
        if (surcharges.includes("timed")) surchargeTotal += 17;
        return { total: +((total + surchargeTotal) * (1 + FUEL_SURCHARGE)).toFixed(2), base: +total.toFixed(2), surcharges: surchargeTotal, fuel: +((total + surchargeTotal) * FUEL_SURCHARGE).toFixed(2), note: osInfo.label };
      };
      
      const ndCalc = calcOS(baseNd);
      const ecoCalc = calcOS(baseEco);
      if (ndCalc) { result.nd = ndCalc.total; result.breakdown.nd = ndCalc; }
      else { result.breakdown.ndNote = "Premium not available for this zone"; }
      if (ecoCalc) { result.eco = ecoCalc.total; result.breakdown.eco = ecoCalc; }
      else { result.breakdown.ecoNote = "Economy not available for this zone"; }
    }
  } else if (haulier === "Pallex Essex") {
    const z = matchPallexZone(postcode);
    if (!z) { result.errors.push("Postcode not found in Pallex Essex zones"); return result; }
    const zoneName = z[0];
    result.zone = typeof zoneName === 'number' ? `Zone ${zoneName}` : zoneName;

    // Determine pallet type index: <600kg = Half (2), >=600kg = Full (4)
    const typeIdx = weightKg >= 600 ? 4 : 2;
    const typeName = weightKg >= 600 ? "Full" : "Half";

    // Oversized: 8x4 booked as 2.4m x 1.2m = Rate + 100% (2x base)
    let oversizedMultiplier = 1;
    let oversizedNote = "";
    if (palletSize === "8x4") {
      oversizedMultiplier = 2;
      oversizedNote = "8x4 (2.4m x 1.2m) = Rate + 100%";
    } else if (palletSize === "10x4") {
      // 3.0m x 1.2m: width 120cm, length 300cm = Rate + 175% to Rate + 200%
      oversizedMultiplier = 3;
      oversizedNote = "10x4 (3.0m x 1.2m) = Rate + 200%";
    } else if (palletSize === "10x5") {
      // 3.0m x 1.5m: width 150cm, length 300cm = Rate + 300%
      oversizedMultiplier = 4;
      oversizedNote = "10x5 (3.0m x 1.5m) = Rate + 300%";
    } else if (palletSize === "5x5") {
      // 1.525m x 1.525m: width 152cm, length 152cm = Rate + 75% ≈ 1.75x
      oversizedMultiplier = 1.75;
      oversizedNote = "5x5 (1.525m x 1.525m) = Rate + 75%";
    } else if (palletSize === "4x4") {
      oversizedMultiplier = 1;
      oversizedNote = "";
    } else if (palletSize === "custom" && customW && customL) {
      const ow = getPallexOversizeMultiplier(parseFloat(customW), parseFloat(customL));
      if (!ow) {
        result.errors.push(`Custom size ${customW} x ${customL}mm is outside the Pallex size categories. Contact Pallex for a manual quote.`);
        return result;
      }
      oversizedMultiplier = ow.multiplier;
      oversizedNote = `Custom ${ow.note} = Rate x ${ow.multiplier}`;
      result.info.push("Custom size mapped to the nearest Pallex category (rounded up) — verify with Pallex if borderline.");
    }
    if (oversizedNote) result.info.push(`Oversized: ${oversizedNote}`);

    const FUEL_SURCHARGE = getFuelSurcharge(haulier);
    result.fuelPct = FUEL_SURCHARGE * 100;

    // Calculate surcharges
    let surchargeTotal = 0;
    if (surcharges.includes("am")) surchargeTotal += 18;
    if (surcharges.includes("timed")) surchargeTotal += 23;
    if (surcharges.includes("hand")) surchargeTotal += 25 * qty;

    // Next Day
    const ndRates = PALLEX_ND[zoneName];
    if (ndRates) {
      const baseRate = ndRates[typeIdx];
      const ndPerPallet = baseRate * oversizedMultiplier;
      const ndTotal = ndPerPallet * qty;
      const ndBeforeFuel = ndTotal + surchargeTotal;
      result.nd = +(ndBeforeFuel * (1 + FUEL_SURCHARGE)).toFixed(2);
      result.breakdown.nd = { base: +ndTotal.toFixed(2), surcharges: surchargeTotal, fuel: +(ndBeforeFuel * FUEL_SURCHARGE).toFixed(2), note: `${typeName} £${baseRate} x ${oversizedMultiplier} x ${qty}` };
    } else {
      result.info.push("Next Day not available for this zone");
    }

    // Economy
    const ecoRates = PALLEX_ECO[zoneName];
    if (ecoRates) {
      const baseRate = ecoRates[typeIdx];
      const ecoPerPallet = baseRate * oversizedMultiplier;
      const ecoTotal = ecoPerPallet * qty;
      const ecoBeforeFuel = ecoTotal + surchargeTotal;
      result.eco = +(ecoBeforeFuel * (1 + FUEL_SURCHARGE)).toFixed(2);
      result.breakdown.eco = { base: +ecoTotal.toFixed(2), surcharges: surchargeTotal, fuel: +(ecoBeforeFuel * FUEL_SURCHARGE).toFixed(2), note: `${typeName} £${ecoRates[typeIdx]} x ${oversizedMultiplier} x ${qty}` };
    } else {
      result.info.push("Economy not available for this zone");
    }

    // Zones 15,16,17,23: Economy only
    if ([15,16,17,23].includes(zoneName)) {
      result.nd = null;
      result.breakdown.nd = null;
    }
    // Zones 20,21: Next Day only
    if ([20,21].includes(zoneName)) {
      result.eco = null;
      result.breakdown.eco = null;
    }
  }
  
  // Surcharge warnings - update hand offload check
  if (surcharges.includes("hand") && haulier !== "CDL" && haulier !== "Pallex Essex") {
    result.warnings.push(`Hand offload: Not standard on ${haulier}'s rate sheet. Check with haulier.`);
  }
  if (surcharges.includes("small")) {
    result.warnings.push(`Small vehicle: Not on standard rate sheet. Check with ${haulier}.`);
  }
  
  // Courier viability: if destination is roughly 2hrs drive or less from collection
  // Use zone number as a proxy -- lower zones are local/nearby
  const zoneNum = (() => {
    const zStr = result.zone || '';
    const m = zStr.match(/\d+/);
    return m ? parseInt(m[0]) : null;
  })();
  
  const isNearby = (() => {
    if (!collectionId || !COURIER_POSTCODES[collectionId]) return false;
    const { area } = extractPostcodeArea(postcode);
    return COURIER_POSTCODES[collectionId].includes(area);
  })();
  
  if (isNearby) {
    result.courier = "Destination looks within ~2hrs of collection. If this job is urgent, it may be worth checking a courier rate.";
  }

  // Weight warnings per pallet
  const heaviestPallet = weightKg;
  if (spaces <= 1 && heaviestPallet > 2000) {
    result.warnings.push("Pallet weight exceeds 2,000kg. This is above the absolute maximum for a standard pallet. Contact the haulier.");
  } else if (spaces <= 1 && heaviestPallet > 1200) {
    result.warnings.push("Pallet weight exceeds 1,200kg (Full Pallet max for a standard footprint). The haulier may apply additional charges or refuse the consignment.");
  } else if (spaces >= 2 && heaviestPallet > 2000) {
    result.warnings.push("Pallet weight exceeds 2,000kg. This is above the typical maximum even for oversized pallets. Contact the haulier.");
  }

  // Small vehicle + combined weight warning
  if (surcharges.includes("small") && allWeights) {
    const combinedWeight = allWeights.reduce((a, b) => a + b, 0);
    if (combinedWeight > 2500) {
      result.warnings.push("Small vehicle selected with combined weight over 2,500kg. Small vehicles are typically limited to 2,500kg. Check with the haulier that this consignment can be accommodated.");
    }
  }
  
  if (!_districtPlausible && result.zone && result.errors.length === 0) {
    result.warnings.push(postcode.toUpperCase().trim() + " matched the rate sheet by area, but this district isn't a recognised UK postcode district. Double-check the postcode before quoting.");
  }
  return result;
}

// ============ IMMINGHAM CALCULATOR ============

const IMM_ZONE_POSTCODES = {
  "Zone 1": ["DN","HU","LN","YO"],
  "Zone 2": ["B","BB","BD","BL","CB","CH","CV","CW","DE","DL","DY","HD","HG","HX","L","LE","LS","M","NG","NN","OL","PE","PR","S","SK","ST","TS","WA","WF","WN","WS","WV"],
  "Zone 3": ["AL","CA","CM","FY","GL","HP","HR","IG","IP","LA","MK","NR","OX","SG","TF","WR"],
  "Zone 4": ["BR","BS","CF","CO","CR","DA","DG","DH","EN","GU","HA","KT","LD","LL","ME","NE","NP","PO","RG","RH","RM","SL","SM","SN","SR","SS","SY","TW","UB","WD"],
  "Zone 5": ["BA","BH","BN","CT","DT","EH","FK","G","KA","ML","SA","SO","SP","TD","TN"],
  "Zone 6": ["AB","DD","EX","IV","KW","KY","PA","PH","PL","TA","TQ","TR"],
  "London": ["E","EC","N","NW","SE","SW","W","WC"],
};

// Rate on Request: specific postcodes/ranges within Zone 6
const IMM_ROR_AREAS = ["IV","KW"];
const IMM_ROR_RANGES = [
  {area:"PA",lo:20,hi:999},{area:"PH",lo:23,hi:26},{area:"PH",lo:32,hi:44},
  {area:"PL",lo:23,hi:999},{area:"KA",lo:27,hi:28},{area:"TR",lo:21,hi:25},
  {area:"PO",lo:30,hi:41},
];

function matchImmZone(postcode) {
  const { area } = extractPostcodeArea(postcode);
  for (const [zone, areas] of Object.entries(IMM_ZONE_POSTCODES)) {
    if (areas.includes(area)) return zone;
  }
  return null;
}

function isImmROR(postcode) {
  const { area, district } = extractPostcodeArea(postcode);
  if (IMM_ROR_AREAS.includes(area)) return true;
  for (const r of IMM_ROR_RANGES) {
    if (r.area === area && district !== null && district >= r.lo && district <= r.hi) return true;
  }
  return false;
}

const IMM_WEIGHT_BRACKETS = [1000, 2000, 3000, 4000, 5000, 6000, 7000, 8000, 9000, 10000];
const IMM_RATES = {
  "Zone 1": [66.41,108.68,120.75,150.94,169.05,175.09,208.90,229.43,249.95,271.69],
  "Zone 2": [76.07,118.34,132.83,169.05,187.16,193.20,229.43,253.58,276.52,300.67],
  "Zone 3": [78.49,124.43,138.86,178.71,199.24,205.28,245.12,270.48,295.84,334.48],
  "Zone 4": [84.53,126.79,144.90,187.16,211.31,223.39,262.03,289.80,317.57,346.55],
  "Zone 5": [108.68,150.94,169.05,211.31,235.46,247.54,286.18,313.95,342.93,370.70],
  "Zone 6": [156.98,229.43,274.84,350.18,410.55,483.00,536.13,597.71,659.30,722.09],
  "London": [114.71,163.01,211.31,259.61,289.80,319.99,371.91,412.97,455.23,496.28],
};

const IMM_FUEL = 0.13;
const IMM_MATERIALS = [
  { id: "birch8x4", label: "Birch 8x4", density: 720, w: 2440, l: 1220 },
  { id: "pine8x4", label: "Pine 8x4", density: 689, w: 2440, l: 1220 },
  { id: "decmaple8x4", label: "Dec Maple 8x4", density: 615, w: 2440, l: 1220 },
];

function calcImmingham(postcode, lines, handball) {
  const result = { charge: null, breakdown: {}, errors: [], warnings: [], info: [], zone: null, cdl: null };
  if (!postcode || postcode.length < 2) { result.errors.push("Enter a delivery postcode"); return result; }

  // Check Rate on Request
  if (isImmROR(postcode)) {
    result.errors.push(postcode.toUpperCase() + " is Rate on Request. Contact Immingham directly for a quote.");
    return result;
  }

  // Auto-detect zone
  const zone = matchImmZone(postcode);
  if (!zone) { result.errors.push("Postcode " + postcode.toUpperCase() + " not found in Immingham zones"); return result; }
  result.zone = zone;

  const hasLines = lines.some(l => l.material && l.thickness > 0 && l.sheets > 0);
  if (!hasLines) { result.errors.push("Add at least one material line with thickness and sheets"); return result; }

  let totalActualWeight = 0;
  let totalPallets = 0;
  let totalHeightMm = 0;

  for (const line of lines) {
    if (!line.material || !line.thickness || !line.sheets) continue;
    const mat = IMM_MATERIALS.find(m => m.id === line.material);
    if (!mat) continue;
    totalActualWeight += (line.thickness * mat.w * mat.l * line.sheets * mat.density) / 1000000000;
    totalPallets += (line.pallets || 0);
    totalHeightMm += (line.sheets * line.thickness);

    // Process mixed pallet sub-lines (share the same pallets)
    if (line.mixed && line.subLines) {
      for (const sub of line.subLines) {
        if (!sub.material || !sub.thickness || !sub.sheets) continue;
        const subMat = IMM_MATERIALS.find(m => m.id === sub.material);
        if (!subMat) continue;
        totalActualWeight += (sub.thickness * subMat.w * subMat.l * sub.sheets * subMat.density) / 1000000000;
        totalHeightMm += (sub.sheets * sub.thickness);
      }
    }
    // Add pallet allowance for this line's pallets
    totalHeightMm += ((line.pallets || 0) * 160);
  }
  totalActualWeight += totalPallets * 20;
  const totalStacks = totalHeightMm > 0 ? Math.ceil(totalHeightMm / 2000) : 0;
  const footprintM2 = (2440 / 1000) * (1220 / 1000);
  const volWeight = (footprintM2 / 2.4) * 2000 * totalStacks;

  const chargeableWeight = Math.max(totalActualWeight, volWeight);
  // Guard: any active line with 0 pallets is a mis-type
  for (const ln of lines) {
    if (ln.material && ln.sheets && ln.thickness && (!parseInt(ln.pallets) || parseInt(ln.pallets) < 1)) {
      result.errors.push("Pallet count must be at least 1 on every product line.");
      return result;
    }
  }
  const bracketWeight = Math.ceil(chargeableWeight / 1000) * 1000;

  if (bracketWeight <= 0) { result.errors.push("Weight calculates to zero. Check your inputs."); return result; }
  if (bracketWeight > 10000) { result.errors.push("Weight exceeds 10,000kg. Contact Immingham for a quote."); return result; }

  const bracketIdx = IMM_WEIGHT_BRACKETS.indexOf(bracketWeight);
  const rates = IMM_RATES[zone];
  if (!rates || bracketIdx === -1) { result.errors.push("Rate lookup failed"); return result; }

  const baseRate = rates[bracketIdx];
  const handballCharge = handball ? 20 : 0;
  const totalBeforeFuel = baseRate + handballCharge;
  const total = +(totalBeforeFuel * (1 + IMM_FUEL)).toFixed(2);

  result.charge = total;
  result.breakdown = {
    actualWeight: +totalActualWeight.toFixed(2), volWeight: +volWeight.toFixed(0),
    chargeableWeight: +chargeableWeight.toFixed(2), bracketWeight,
    totalHeightMm: +totalHeightMm.toFixed(0), totalStacks, totalPallets,
    baseRate, handballCharge, fuelCharge: +(totalBeforeFuel * IMM_FUEL).toFixed(2),
  };

  if (volWeight > totalActualWeight) {
    result.info.push("Volumetric weight (" + volWeight.toFixed(0) + "kg) exceeds actual weight (" + totalActualWeight.toFixed(0) + "kg). Charged on volumetric.");
  }
  result.info.push("Height: " + totalHeightMm.toFixed(0) + "mm across " + totalStacks + " stack" + (totalStacks !== 1 ? "s" : "") + " (max 2000mm per stack)");

  // Stack height warnings
  const exceedsStackHeight = totalHeightMm > 2000;
  if (exceedsStackHeight && totalPallets >= 4) {
    result.warnings.push("HIGHLY recommended: Obtain a quote from Immingham.");
  } else if (exceedsStackHeight) {
    result.warnings.push("Recommended: obtain a quote from Immingham. This rate is a best guess and may over-estimate.");
  }

  // CDL comparison: 8x4 = 2 pallet spaces, calculate per-pallet then multiply
  // Try exact postcode first, then fallback with district '1' for bare area codes (e.g. 'ML' -> 'ML1')
  let cdlZone = matchCDLZone(postcode);
  if (!cdlZone) {
    const { area, district } = extractPostcodeArea(postcode);
    if (district === null) cdlZone = matchCDLZone(area + '1');
  }
  if (cdlZone) {
    const totalSpaces = 2 * totalPallets; // 8x4 = 2 spaces each
    const cdlNdPerSpace = cdlZone.nd;
    const cdlEcoPerSpace = cdlZone.eco;
    const cdlResult = { zone: "Zone " + cdlZone.zone, nd: null, eco: null };

    if (cdlNdPerSpace !== "N/A" && cdlNdPerSpace !== "POA" && typeof cdlNdPerSpace === 'number') {
      cdlResult.nd = +(((cdlNdPerSpace * totalSpaces) + 12) * (1 + getFuelSurcharge("CDL"))).toFixed(2);
    }
    if (cdlEcoPerSpace !== "N/A" && cdlEcoPerSpace !== "POA" && typeof cdlEcoPerSpace === 'number') {
      cdlResult.eco = +(((cdlEcoPerSpace * totalSpaces) + 12) * (1 + getFuelSurcharge("CDL"))).toFixed(2);
    }
    result.cdl = cdlResult;
  }

  // Courier viability: use same postcode list as Immingham collection points
  const immArea = extractPostcodeArea(postcode).area;
  if (COURIER_POSTCODES["immingham"] && COURIER_POSTCODES["immingham"].includes(immArea)) {
    result.courier = "Destination is close to Immingham. If this job is urgent, it may be worth checking a courier rate.";
  }

  return result;
}

                      <div style={{ display: 'flex', gap: 8 }}>
                        {immResult.cdl.nd !== null && cdlCard('Next Day', immResult.cdl.nd, ndCheaper)}
                        {immResult.cdl.eco !== null && cdlCard('Economy', immResult.cdl.eco, ecoCheaper)}
                        {!immResult.cdl.nd && !immResult.cdl.eco && (
                          <div style={{ padding: '10px', fontSize: 13, color: '#53605a' }}>CDL rates not available for this postcode</div>
                        )}
                      </div>
                    </div>
                  )}
                </>);
              })()}

              {/* Courier viability */}
              {immResult.courier && (
                <div style={{ padding: '12px 14px', borderRadius: 10, background: '#fff4e8', border: '1.5px solid #d98a63', color: '#b5471c', fontSize: 13, marginTop: 8, lineHeight: 1.5 }}><span style={{ fontWeight: 700 }}>Courier viability: </span>{immResult.courier}</div>
              )}

              {/* Show calculations toggle */}
              <div style={{ textAlign: 'center', marginTop: 8 }}>
                <button onClick={() => setShowCalcs(!showCalcs)} style={{ background: 'none', border: 'none', cursor: 'pointer', fontSize: 13, fontWeight: 600, color: '#007835', padding: '6px 12px' }}>
                  {showCalcs ? '▲ Hide calculations' : '▼ Show calculations'}
                </button>
              </div>
              {showCalcs && (
                <div style={{ marginTop: 6 }}>
                  <div style={styles.breakdown}>
                    <div>Actual: {immResult.breakdown.actualWeight}kg | Volumetric: {immResult.breakdown.volWeight}kg | Charged at: {immResult.breakdown.bracketWeight}kg bracket</div>
                    {(!immResult.warnings || immResult.warnings.length === 0) && <div>Base rate: £{immResult.breakdown.baseRate.toFixed(2)}{immResult.breakdown.handballCharge > 0 ? ' + £20 handball' : ''} + £{immResult.breakdown.fuelCharge} fuel ({(IMM_FUEL*100).toFixed(0)}%). Excl. VAT.</div>}
                  </div>
                  {immResult.info.length > 0 && <div style={{ marginTop: 8 }}>{immResult.info.map((n, i) => (<div key={i} style={{ padding: '8px 12px', borderRadius: 8, background: '#f1f9f3', border: '1px solid #cce8d6', color: '#3D5332', fontSize: 13, marginTop: i > 0 ? 4 : 0, lineHeight: 1.5 }}>{n}</div>))}</div>}
                </div>
              )}
            </>)}
                <div style={{ borderTop: '1px solid #dde5e0', marginTop: 12, paddingTop: 10 }}><button onClick={() => { setImmResult(null); setShowCalcs(false); setShowCdlCompare(false); setShowImmRate(false); }} style={{ background: '#fff', border: '1.5px solid #007835', borderRadius: 9, padding: '8px 18px', fontSize: 13, fontWeight: 700, color: '#007835', cursor: 'pointer', fontFamily: 'Figtree' }}>← Edit quote</button></div>
              </div>)}
            </div>
          </div>
        </div>
      )}
      
      </div>{/* end workspace */}
    </div>
  );
}
